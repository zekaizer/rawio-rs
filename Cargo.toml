[workspace]
resolver = "3"
members = ["crates/rawio", "crates/rawio-core"]

[workspace.package]
version = "0.1.0"
authors = ["Luke Lee"]
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
rawio-core = { path = "crates/rawio-core" }
clap = { version = "4.6.6", features = ["derive"] }
thiserror = "2.0.20"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
