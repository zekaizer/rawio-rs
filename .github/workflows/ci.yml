name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  # The Windows-only modules must at least compile and lint from the Linux
  # development host, not just on a Windows runner.
  cross:
    name: cross-build for Windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: cargo clippy --target x86_64-pc-windows-gnu --all-targets -- -D warnings
      - run: cargo build --release --target x86_64-pc-windows-gnu
      - uses: actions/upload-artifact@v7
        with:
          name: rawio-x86_64-pc-windows-gnu
          path: target/x86_64-pc-windows-gnu/release/rawio.exe
